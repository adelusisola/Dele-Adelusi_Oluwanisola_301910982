# Containers for Portfolios 4 and 5. Portfolios 1 to 3 use a local PostgreSQL.
services:
  mongo:
    image: mongo:7
    container_name: vant-mongo
    ports:
      - "27017:27017"
    volumes:
      - ./portfolio-4-nosql:/work

  pg-primary:
    image: postgres:18
    container_name: vant-primary
    profiles: ["replication"]
    command: postgres -c wal_level=replica -c max_wal_senders=5 -c max_replication_slots=5
    environment: &pg
      POSTGRES_USER: vant
      POSTGRES_PASSWORD: vant_dev_password
      POSTGRES_DB: vant_personal
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5440:5432"
    volumes:
      - ./portfolio-5-distributed-cloud/primary-init:/docker-entrypoint-initdb.d:ro
      - ./portfolio-1-database-design/schema.sql:/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U vant -d vant_personal"]
      interval: 3s
      retries: 30

  pg-replica:
    image: postgres:18
    container_name: vant-replica
    profiles: ["replication"]
    entrypoint: ["/bin/bash", "/replica-start.sh"]
    environment: *pg
    depends_on:
      pg-primary:
        condition: service_healthy
    ports:
      - "5441:5432"
    volumes:
      - ./portfolio-5-distributed-cloud/replica-start.sh:/replica-start.sh:ro
